name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: -tags webkit2_41
            asset: edex-ui-go-linux-amd64.tar.gz
          - os: windows-latest
            platform: windows/amd64
            tags: ""
            asset: edex-ui-go-windows-amd64.zip
          - os: macos-latest
            platform: darwin/universal
            tags: ""
            asset: edex-ui-go-macos-universal.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          wails build -clean -platform ${{ matrix.platform }} ${{ matrix.tags }} \
            -ldflags "-s -w -X edex-ui-go/internal/buildinfo.Version=${VERSION}"
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp LICENSE README.md build/bin/
          cd build/bin
          case "${{ runner.os }}" in
            Linux)   tar czf "../../dist/${{ matrix.asset }}" edex-ui-go LICENSE README.md ;;
            Windows) 7z a "../../dist/${{ matrix.asset }}" edex-ui-go.exe LICENSE README.md ;;
            macOS)   app=$(ls -d *.app | head -1); ditto -c -k --keepParent "$app" "../../dist/${{ matrix.asset }}" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: eDEX-UI-GO ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') }}
          files: dist/*
